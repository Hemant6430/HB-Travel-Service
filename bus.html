<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Tickets | HB Travel Service</title>

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="search">
        <h2>Search Bus Ticket</h2>

        <form action="booking.html" method="get"
              onsubmit="return validateBusSearch()">

            <label for="from">From</label>
            <select id="from" name="from" required>
                <option value="">Select Departure</option>
                <option value="Kathmandu (Gongabu Bus Park)">Kathmandu (Gongabu Bus Park)</option>
                <option value="Pokhara Bus Park">Pokhara Bus Park</option>
                <option value="Chitwan (Bharatpur)">Chitwan (Bharatpur)</option>
                <option value="Butwal Bus Park">Butwal Bus Park</option>
                <option value="Dhangadhi Bus Park">Dhangadhi Bus Park</option>
                <option value="Nepalgunj Bus Park">Nepalgunj Bus Park</option>
                <option value="Biratnagar Bus Park">Biratnagar Bus Park</option>
                <option value="Janakpur Bus Park">Janakpur Bus Park</option>
                <option value="Birgunj Bus Park">Birgunj Bus Park</option>
                <option value="Mahendranagar Bus Park">Mahendranagar Bus Park</option>
            </select>

            <label for="to">To</label>
            <select id="to" name="to" required>
                <option value="">Select Destination</option>
                <option value="Kathmandu (Gongabu Bus Park)">Kathmandu (Gongabu Bus Park)</option>
                <option value="Pokhara Bus Park">Pokhara Bus Park</option>
                <option value="Chitwan (Bharatpur)">Chitwan (Bharatpur)</option>
                <option value="Butwal Bus Park">Butwal Bus Park</option>
                <option value="Dhangadhi Bus Park">Dhangadhi Bus Park</option>
                <option value="Nepalgunj Bus Park">Nepalgunj Bus Park</option>
                <option value="Biratnagar Bus Park">Biratnagar Bus Park</option>
                <option value="Janakpur Bus Park">Janakpur Bus Park</option>
                <option value="Birgunj Bus Park">Birgunj Bus Park</option>
                <option value="Mahendranagar Bus Park">Mahendranagar Bus Park</option>
            </select>

            <label for="date">Travel Date</label>
            <input type="date" id="date" name="date" required>

            <label for="passengers">Passengers</label>
            <select id="passengers" name="passengers" required>
                <option value="1">1 Passenger</option>
                <option value="2">2 Passengers</option>
                <option value="3">3 Passengers</option>
                <option value="4">4 Passengers</option>
            </select>

            <button type="submit">Search Bus</button>
        </form>
    </section>

    <script>
        const travelDate = document.getElementById("date");
        travelDate.min = new Date().toLocaleDateString("en-CA");

        function validateBusSearch() {
            const from = document.getElementById("from").value;
            const to = document.getElementById("to").value;
            const date = travelDate.value;

            if (from === to) {
                alert("Departure and destination must be different.");
                return false;
            }

            if (!date || date < travelDate.min) {
                alert("Please select today or a future travel date.");
                return false;
            }

            return true;
        }
    </script>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>
</html>
